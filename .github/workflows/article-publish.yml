name: Article Publish — Auto-update articles-data.js and sitemap.xml

on:
  push:
    branches:
      - astro-migration
    paths:
      - 'src/content/articles/**.md'

jobs:
  update-article-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find new or modified article files
        id: find-articles
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'src/content/articles/*.md' || git diff --name-only HEAD -- 'src/content/articles/*.md')
          echo "changed_files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED"

      - name: Parse frontmatter and update articles-data.js and sitemap.xml
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const articlesDir = 'src/content/articles';
          const files = fs.readdirSync(articlesDir).filter(f => f.endsWith('.md'));

          function parseFrontmatter(content) {
            const match = content.match(/^---\n([\s\S]*?)\n---/);
            if (!match) return null;
            const fm = {};
            match[1].split('\n').forEach(line => {
              const colonIndex = line.indexOf(':');
              if (colonIndex > 0) {
                const key = line.slice(0, colonIndex).trim();
                const value = line.slice(colonIndex + 1).trim().replace(/^["']|["']$/g, '');
                fm[key] = value;
              }
            });
            return fm;
          }

          const articles = [];
          for (const file of files) {
            const content = fs.readFileSync(path.join(articlesDir, file), 'utf8');
            const fm = parseFrontmatter(content);
            if (!fm) continue;
            // Derive slug from filename, not frontmatter
            const slug = file.replace(/\.md$/, '');
            articles.push({
              slug,
              title: fm.title || '',
              category: fm.category || 'BEGINNER',
              blurb: fm.blurb || fm.description || '',
              url: `/${slug}`,
              readTime: fm.readTime || '6 min read',
              publishedAt: fm.publishedAt || new Date().toISOString().split('T')[0],
              comingSoon: false
            });
          }

          // Sort by publishedAt descending
          articles.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

          // Build new ARTICLES_DATA array string
          const articlesJson = articles.map(a => `  {
    slug: "${a.slug}",
    title: "${a.title.replace(/"/g, '\\"')}",
    category: "${a.category}",
    blurb: "${a.blurb.replace(/"/g, '\\"')}",
    url: "${a.url}",
    readTime: "${a.readTime}",
    publishedAt: "${a.publishedAt}",
    comingSoon: false,
  }`).join(',\n');

          const dataFile = 'public/js/articles-data.js';
          let currentData = fs.readFileSync(dataFile, 'utf8');

          const newData = currentData.replace(
            /const ARTICLES_DATA\s*=\s*\[[\s\S]*?\];/,
            `const ARTICLES_DATA = [\n${articlesJson}\n];`
          );

          if (newData === currentData) {
            console.log('WARNING: articles-data.js pattern not matched — check file format');
          } else {
            fs.writeFileSync(dataFile, newData, 'utf8');
            console.log(`Updated articles-data.js with ${articles.length} articles`);
          }

          // Update sitemap.xml
          const sitemapFile = 'public/sitemap.xml';
          let sitemap = fs.readFileSync(sitemapFile, 'utf8');

          const baseUrl = 'https://resellingshoes.com';
          const today = new Date().toISOString().split('T')[0];

          for (const article of articles) {
            const url = `${baseUrl}${article.url}`;
            const urlEntry = `
  <url>
    <loc>${url}</loc>
    <lastmod>${today}</lastmod>
    <priority>0.8</priority>
  </url>`;

            if (!sitemap.includes(`<loc>${url}</loc>`)) {
              sitemap = sitemap.replace('</urlset>', `${urlEntry}\n</urlset>`);
              console.log(`Added to sitemap: ${url}`);
            }
          }

          fs.writeFileSync(sitemapFile, sitemap, 'utf8');
          console.log('Sitemap updated');
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/js/articles-data.js public/sitemap.xml
          git diff --staged --quiet || git commit -m "auto: update articles-data.js and sitemap.xml"
          git push
