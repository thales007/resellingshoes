name: Article Publish — Auto-update articles-data.js and sitemap.xml

on:
  push:
    branches:
      - astro-migration
    paths:
      - 'src/content/articles/**.md'

jobs:
  update-article-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find new or modified article files
        id: find-articles
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'src/content/articles/*.md' || git diff --name-only HEAD -- 'src/content/articles/*.md')
          echo "changed_files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED"

      - name: Update articles-data.js and sitemap.xml
        run: node .github/scripts/update-articles.cjs

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/js/articles-data.js public/sitemap.xml
          git diff --staged --quiet || git commit -m "auto: update articles-data.js and sitemap.xml"
          git push
